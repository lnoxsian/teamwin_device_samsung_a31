name: Build TWRP Recovery

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP Minimal Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - 'twrp-12.1'
          - 'twrp-11'

jobs:
  build:
    name: Compile TWRP
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free Disk Space
        run: |
          echo "==> Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "==> Disk space after cleanup:"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize and Sync TWRP Manifest
        run: |
          mkdir twrp && cd twrp
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.manifest_branch }}
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Place Device Tree
        run: |
          mkdir -p twrp/device/samsung/a31
          cp -r device_tree/* twrp/device/samsung/a31/
          chmod +x twrp/device/samsung/a31/mkbootimg

      - name: Compile TWRP Recovery
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_a31-eng
          mka recoveryimage -j$(nproc)

      - name: Check Output Images
        run: |
          ls -lh twrp/out/target/product/a31/recovery.img || true
          ls -lh twrp/out/target/product/a31/recovery.tar || true

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-A31-${{ github.event.inputs.manifest_branch }}
          path: |
            twrp/out/target/product/a31/recovery.tar
            twrp/out/target/product/a31/recovery.img
