name: Build TWRP Recovery

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP Minimal Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - 'twrp-12.1'
          - 'twrp-11'
      kernel_image_url:
        description: 'Custom Image.gz URL (optional - leave blank to use repo prebuilt)'
        required: false
        default: ''
        type: string
      kernel_dtb_url:
        description: 'Custom mt6768.dtb URL (optional - leave blank to use repo prebuilt)'
        required: false
        default: ''
        type: string
      fetch_latest_kernel_ci:
        description: 'Fetch latest slim kernel from a315g-S CI run'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Compile TWRP
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free Disk Space
        run: |
          echo "==> Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "==> Disk space after cleanup:"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gnupg flex bison build-essential zip curl bc rsync \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 ccache libssl-dev \
            liblz4-tool squashfs-tools
          sudo apt-get install -y libncurses5 lib32ncurses-dev || true

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: twrp-ccache-${{ github.event.inputs.manifest_branch }}-${{ github.run_id }}
          restore-keys: |
            twrp-ccache-${{ github.event.inputs.manifest_branch }}-

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          if [ ! -f ~/bin/repo ]; then
            curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+rx ~/bin/repo
          fi
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Cache TWRP Manifest (.repo)
        uses: actions/cache@v4
        with:
          path: twrp/.repo
          key: twrp-repo-${{ github.event.inputs.manifest_branch }}-${{ github.run_id }}
          restore-keys: |
            twrp-repo-${{ github.event.inputs.manifest_branch }}-

      - name: Initialize and Sync TWRP Manifest
        run: |
          mkdir -p twrp && cd twrp
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          if [ ! -d .repo/manifests ]; then
            repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.manifest_branch }}
          fi
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Place Device Tree and Setup Kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p twrp/device/samsung/a31
          cp -r device_tree/* twrp/device/samsung/a31/
          chmod +x twrp/device/samsung/a31/mkbootimg

          # 1. Download custom Image.gz from URL if provided
          if [ -n "${{ github.event.inputs.kernel_image_url }}" ]; then
            echo "==> Downloading custom Image.gz from URL..."
            curl -fL "${{ github.event.inputs.kernel_image_url }}" -o twrp/device/samsung/a31/prebuilt/KernelImage
          fi

          # 2. Download custom mt6768.dtb from URL if provided
          if [ -n "${{ github.event.inputs.kernel_dtb_url }}" ]; then
            echo "==> Downloading custom mt6768.dtb from URL..."
            curl -fL "${{ github.event.inputs.kernel_dtb_url }}" -o twrp/device/samsung/a31/prebuilt/KernelDTB
          fi

          # 3. Automatically fetch latest slim kernel from a315g-S CI if requested
          if [ "${{ github.event.inputs.fetch_latest_kernel_ci }}" = "true" ]; then
            echo "==> Fetching latest slim recovery kernel artifact from a315g-S CI..."
            RUN_ID=$(gh run list --repo lnoxsian/a315g-S --workflow build_recovery_kernel.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
            if [ -n "$RUN_ID" ]; then
              echo "==> Found successful kernel run ID: $RUN_ID"
              gh run download "$RUN_ID" --repo lnoxsian/a315g-S --name "A31-Slim-Kernel-a31_recovery_defconfig" --dir /tmp/ci_kernel
              if [ -f /tmp/ci_kernel/Image.gz ]; then
                cp /tmp/ci_kernel/Image.gz twrp/device/samsung/a31/prebuilt/KernelImage
                echo "==> Successfully replaced KernelImage with CI artifact"
              fi
              DTB_FILE=$(find /tmp/ci_kernel -name "mt6768.dtb" | head -n 1)
              if [ -n "$DTB_FILE" ]; then
                cp "$DTB_FILE" twrp/device/samsung/a31/prebuilt/KernelDTB
                echo "==> Successfully replaced KernelDTB with CI artifact"
              fi
            else
              echo "==> WARNING: Could not find successful a315g-S run. Using repo prebuilt kernel."
            fi
          fi

          # 4. Verify prebuilt kernel files
          echo "==> Active Prebuilt Kernel for TWRP Build:"
          ls -lh twrp/device/samsung/a31/prebuilt/KernelImage
          ls -lh twrp/device/samsung/a31/prebuilt/KernelDTB

      - name: Compile TWRP Recovery
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=~/.ccache
          ccache -M 5G
          ccache -z
          source build/envsetup.sh
          lunch twrp_a31-eng
          mka recoveryimage -j$(nproc)
          ccache -s

      - name: Check Output Images
        run: |
          ls -lh twrp/out/target/product/a31/recovery.img || true
          ls -lh twrp/out/target/product/a31/recovery.tar || true

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-A31-${{ github.event.inputs.manifest_branch }}
          path: |
            twrp/out/target/product/a31/recovery.tar
            twrp/out/target/product/a31/recovery.img
